<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решение квадратного уравнения и Депозит</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bar-container {
            display: flex;
            align-items: flex-end; 
            gap: 20px;
            height: 250px; 
            margin-top: 20px;
        }
        .bar {
            width: 60px;
            transition: height 0.4s ease; 
        }
        #redBar { background-color: red; }
        #greenBar { background-color: green; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="display-2 text-center">Решение квадратного уравнения ax<sup>2</sup>+bx+c=0</h1>
</div>
<div class="container my-5">
    <div class="row">
        <div class="col">
            <img class="img-fluid" src="38355674.jpg">
        </div>
        <div class="col">
            <form action="javascript:square()">
                <div class="mb-3">
                    <label for="A" class="form-label">A</label>
                    <input type="number" step="any" class="form-control" id="A">
                </div>
                <div class="mb-3">
                    <label for="B" class="form-label">B</label>
                    <input type="number" step="any" class="form-control" id="B">
                </div>
                <div class="mb-3">
                    <label for="C" class="form-label">C</label>
                    <input type="number" step="any" class="form-control" id="C" >
                </div>
                <button type="submit" class="btn btn-primary">Рассчитать</button>
            </form>
        </div>
        <div class="col">
            <h2>Решение</h2>
            <p id="korni"></p>
        </div>
    </div>
</div>

<div class="container my-5 pt-5 border-top">
    <div class="row">
        <div class="col-md-6">
            <h3>Депозитный калькулятор</h3>
            <form action="javascript:calculate()">
                <div class="mb-2 d-flex align-items-center">
                    <label for="initialDeposit" class="me-3" style="width: 230px;">Первоначальный депозит</label>
                    <input type="number" step="any" id="initialDeposit" class="form-control" style="width: 150px;" value="9999">
                </div>
                <div class="mb-2 d-flex align-items-center">
                    <label for="depositTerm" class="me-3" style="width: 230px;">Срок вклада, мес.?</label>
                    <input type="number" step="1" min="1" id="depositTerm" class="form-control" style="width: 150px;" value="12">
                </div>
                <div class="mb-2 d-flex align-items-center">
                    <label for="interestRate" class="me-3" style="width: 230px;">Годовая процентная ставка?</label>
                    <input type="number" step="any" id="interestRate" class="form-control" style="width: 150px;" value="5">
                </div>
                <button type="submit" class="btn btn-primary mt-3">Рассчитать</button>
            </form>

            <div class="mt-4 fs-5">
                <div class="d-flex" style="width: 250px; justify-content: space-between;">
                    <strong>Было:</strong> <strong>Станет:</strong>
                </div>
                <div class="d-flex" style="width: 250px; justify-content: space-between;">
                    <span id="wasAmount">9999</span> <span id="willBeAmount">10499</span>
                </div>
            </div>

            <div class="bar-container">
                <div id="redBar" class="bar" style="height: 100px;"></div>
                <div id="greenBar" class="bar" style="height: 105px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="my.js"></script>
</body>
</html>
